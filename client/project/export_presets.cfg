[preset.1.options]

gradle_build/use_gradle_build=true
gradle_build/export_format=0
gradle_build/min_sdk=24
gradle_build/target_sdk=36
package/unique_name="com.immersive2.vrclient"
package/name="Immersive-2 VR Client"
package/signed=true
launcher_icons/main_192x192=""
launcher_icons/adaptive_foreground_432x432=""
launcher_icons/adaptive_background_432x432=""
graphics/opengl_debug=false
xr_features/xr_mode=1
xr_features/hand_tracking=1
xr_features/hand_tracking_frequency=1
xr_features/passthrough=1
permissions/internet=true
permissions/access_network_state=true
gradle_build/manifest_additions="<?xml version=\"1.0\" encoding=\"utf-8\"?>
<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"
          xmlns:tools=\"http://schemas.android.com/tools\">
    <application>
        <activity android:name=\"com.godot.game.GodotApp\" tools:node=\"merge\">
            <intent-filter tools:node=\"merge\">
                <category android:name=\"pvr.intent.category.VR\" />
            </intent-filter>
        </activity>
        <!-- PICO hand tracking: the PICO OpenXR runtime only feeds hand joints to
             apps that declare these flags (the base Godot exporter only emits the
             Meta/oculus.software.handtracking entries). -->
        <meta-data android:name=\"handtracking\" android:value=\"1\" tools:node=\"replace\" />
        <meta-data android:name=\"Hand_Tracking_HighFrequency\" android:value=\"1\" tools:node=\"replace\" />
    </application>
</manifest>"


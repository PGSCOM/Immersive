plugins {
    id 'com.android.library' version '8.5.0'
}

android {
    namespace 'com.immersive2.decoder'
    compileSdk 34

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // Godot Android library — match (or stay close to) the editor version
    compileOnly 'org.godotengine:godot:4.6.3.stable'
}

name: Build

on:
  push:
    branches:
      - main
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  host-windows:
    name: Build Host (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -S host -B host/build -G "Visual Studio 17 2022" -A x64 -DENABLE_NVENC=OFF -DENABLE_AMF=OFF -DENABLE_QSV=OFF

      - name: Build
        run: |
          cmake --build host/build --config Release

      - name: Upload Host Artifact
        uses: actions/upload-artifact@v4
        with:
          name: immersive2_host_windows
          path: host/build/Release/*
          if-no-files-found: warn

  host-linux:
    name: Build Host (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -S host -B host/build -DCMAKE_BUILD_TYPE=Release -DENABLE_NVENC=OFF -DENABLE_AMF=OFF -DENABLE_QSV=OFF

      - name: Build
        run: |
          cmake --build host/build --config Release

      - name: Upload Host Artifact (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: immersive2_host_linux
          path: |
            host/build/immersive2_host
            host/build/Release/immersive2_host
          if-no-files-found: warn

  host-macos:
    name: Build Host (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -S host -B host/build -DCMAKE_BUILD_TYPE=Release -DENABLE_NVENC=OFF -DENABLE_AMF=OFF -DENABLE_QSV=OFF

      - name: Build
        run: |
          cmake --build host/build --config Release

      - name: Upload Host Artifact (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: immersive2_host_macos
          path: |
            host/build/immersive2_host
            host/build/Release/immersive2_host
          if-no-files-found: warn

  client-build:
    name: Build Client (Godot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip xvfb libgl1-mesa-dri libglu1-mesa mesa-utils

      - name: Install Godot headless and templates
        run: |
          set -euo pipefail
          GODOT_VERSION="4.3"
          GODOT_RELEASE="stable"
          GODOT_TAG="${GODOT_VERSION}-${GODOT_RELEASE}"
          GODOT_ZIP="Godot_v${GODOT_TAG}_linux.x86_64.zip"
          GODOT_TPZ="Godot_v${GODOT_TAG}_export_templates.tpz"
          GODOT_BASE_URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_TAG}"

          echo "Downloading Godot ${GODOT_TAG}..."
          curl -fL --retry 5 --retry-delay 3 --retry-connrefused \
            -o "${GODOT_ZIP}" "${GODOT_BASE_URL}/${GODOT_ZIP}"

          echo "Downloading export templates..."
          curl -fL --retry 5 --retry-delay 3 --retry-connrefused \
            -o "${GODOT_TPZ}" "${GODOT_BASE_URL}/${GODOT_TPZ}"

          echo "Installing Godot..."
          unzip -q "${GODOT_ZIP}"
          sudo mv "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          echo "Installing export templates..."
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p /tmp/godot-templates
          unzip -q "${GODOT_TPZ}" -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/* \
            "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/"

          echo "Godot installed: $(godot --version)"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure Android environment for Godot
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "${SDK_ROOT}" ]; then
            echo "Android SDK root was not set by setup-android" >&2
            exit 1
          fi

          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${SDK_ROOT}/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          # Use printf instead of `yes` to avoid SIGPIPE broken pipe error
          # when sdkmanager closes stdin after reading all license confirmations
          printf 'y\n%.0s' {1..20} | sdkmanager --licenses || true
          sdkmanager "platforms;android-32" "build-tools;33.0.2" "ndk;25.2.9519653"

      - name: Export client builds
        run: |
          set -euo pipefail
          WORKSPACE="$(pwd)"
          mkdir -p "${WORKSPACE}/client/export/windows"
          mkdir -p "${WORKSPACE}/client/export/android"

          # Run Godot with X11 + OpenGL3 to avoid Vulkan dependency in CI runners.
          Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset &
          export DISPLAY=:99
          sleep 2

          GODOT_COMMON_ARGS=(
            --rendering-driver opengl3
            --display-driver x11
            --path "${WORKSPACE}/client/project"
          )

          # Import project first (generates .godot/ cache)
          godot "${GODOT_COMMON_ARGS[@]}" --import

          # Export Windows Desktop
          godot "${GODOT_COMMON_ARGS[@]}" \
            --export-debug "Windows Desktop" \
            "${WORKSPACE}/client/export/windows/Immersive2.exe"

          # Export Android (APK)
          godot "${GODOT_COMMON_ARGS[@]}" \
            --export-debug "Android" \
            "${WORKSPACE}/client/export/android/Immersive2.apk"

          echo "Export outputs:"
          ls -lah "${WORKSPACE}/client/export/windows"
          ls -lah "${WORKSPACE}/client/export/android"

          test -f "${WORKSPACE}/client/export/windows/Immersive2.exe"
          test -f "${WORKSPACE}/client/export/android/Immersive2.apk"

      - name: Upload Client Windows Artifact
        uses: actions/upload-artifact@v5
        with:
          name: immersive2_client_windows
          path: client/export/windows/*
          if-no-files-found: warn

      - name: Upload Client Android Artifact
        uses: actions/upload-artifact@v5
        with:
          name: immersive2_client_android
          path: client/export/android/*
          if-no-files-found: warn

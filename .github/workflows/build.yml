name: Build

on:
  push:
    branches:
      - main
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  host-windows:
    name: Build Host (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure CMake
        run: |
          cmake -S host -B host/build -G "Visual Studio 18 2026" -A x64 -DENABLE_NVENC=OFF -DENABLE_AMF=OFF -DENABLE_QSV=OFF

      - name: Build
        run: |
          cmake --build host/build --config Release

      - name: Upload Host Artifact
        uses: actions/upload-artifact@v7
        with:
          name: immersive2_host_windows
          path: host/build/Release/*
          if-no-files-found: warn

  host-linux:
    name: Build Host (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure CMake
        run: |
          cmake -S host -B host/build -DCMAKE_BUILD_TYPE=Release -DENABLE_NVENC=OFF -DENABLE_AMF=OFF -DENABLE_QSV=OFF

      - name: Build
        run: |
          cmake --build host/build --config Release

      - name: Upload Host Artifact (Linux)
        uses: actions/upload-artifact@v7
        with:
          name: immersive2_host_linux
          path: |
            host/build/immersive2_host
            host/build/Release/immersive2_host
          if-no-files-found: warn

  host-macos:
    name: Build Host (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure CMake
        run: |
          cmake -S host -B host/build -DCMAKE_BUILD_TYPE=Release -DENABLE_NVENC=OFF -DENABLE_AMF=OFF -DENABLE_QSV=OFF

      - name: Build
        run: |
          cmake --build host/build --config Release

      - name: Upload Host Artifact (macOS)
        uses: actions/upload-artifact@v7
        with:
          name: immersive2_host_macos
          path: |
            host/build/immersive2_host
            host/build/Release/immersive2_host
          if-no-files-found: warn

  client-build:
    name: Build Client (Godot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip xvfb libxcursor1 libxinerama1 libxrandr2 libxi6 libgl1-mesa-dri libgl1 libglx-mesa0 mesa-utils pulseaudio mesa-vulkan-drivers vulkan-tools
          sudo apt-get install -y libopenxr-loader1 || true

      - name: Install Godot headless and templates
        run: |
          set -euo pipefail
          GODOT_VERSION="4.7.0"
          GODOT_RELEASE="stable"
          GODOT_TAG="${GODOT_VERSION}-${GODOT_RELEASE}"
          GODOT_ZIP="Godot_v${GODOT_TAG}_linux.x86_64.zip"
          GODOT_TPZ="Godot_v${GODOT_TAG}_export_templates.tpz"
          GODOT_BASE_URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_TAG}"

          echo "Downloading Godot ${GODOT_TAG}..."
          curl -fL --retry 5 --retry-delay 3 --retry-connrefused \
            -o "${GODOT_ZIP}" "${GODOT_BASE_URL}/${GODOT_ZIP}"

          echo "Downloading export templates..."
          curl -fL --retry 5 --retry-delay 3 --retry-connrefused \
            -o "${GODOT_TPZ}" "${GODOT_BASE_URL}/${GODOT_TPZ}"

          echo "Installing Godot..."
          unzip -q "${GODOT_ZIP}"
          sudo mv "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          echo "Installing export templates..."
          mkdir -p "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p /tmp/godot-templates
          unzip -q "${GODOT_TPZ}" -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/* \
            "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/"

          echo "Godot installed: $(godot --version)"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure Android environment for Godot
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "${SDK_ROOT}" ]; then
            echo "Android SDK root was not set by setup-android" >&2
            exit 1
          fi

          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${SDK_ROOT}/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          # Use printf instead of `yes` to avoid SIGPIPE broken pipe error
          # when sdkmanager closes stdin after reading all license confirmations
          printf 'y\n%.0s' {1..20} | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865"

      - name: Export client builds
        run: |
          set -euo pipefail
          WORKSPACE="$(pwd)"
          CLIENT_DIR="${WORKSPACE}/client"
          CI_PROJECT_DIR="${CLIENT_DIR}/.ci_project"

          mkdir -p "${CLIENT_DIR}/export/windows"
          mkdir -p "${CLIENT_DIR}/export/android"

          # Build from a temporary project root that matches resource paths.
          rm -rf "${CI_PROJECT_DIR}"
          mkdir -p "${CI_PROJECT_DIR}"

          cp "${CLIENT_DIR}/project/project.godot" "${CI_PROJECT_DIR}/project.godot"
          cp "${CLIENT_DIR}/project/export_presets.cfg" "${CI_PROJECT_DIR}/export_presets.cfg"
          cp "${CLIENT_DIR}/project/openxr_action_map.tres" "${CI_PROJECT_DIR}/openxr_action_map.tres"
          cp -R "${CLIENT_DIR}/project/scenes" "${CI_PROJECT_DIR}/scenes"
          cp -R "${CLIENT_DIR}/project/scripts" "${CI_PROJECT_DIR}/scripts"
          cp -R "${CLIENT_DIR}/project/shaders" "${CI_PROJECT_DIR}/shaders"
          # MUST copy addons/: this holds the im2_decoder editor export plugin
          # and its MediaCodec AAR. Without it the EditorExportPlugin never runs,
          # the AAR is not bundled, and the APK ships with NO hardware decoder
          # (the panel then has nothing to decode H.264 with). project.godot
          # references res://addons/im2_decoder/plugin.cfg in editor_plugins.
          cp -R "${CLIENT_DIR}/project/addons" "${CI_PROJECT_DIR}/addons"

          # Godot 4.6.3 expects gradle_build/use_gradle_build for Android Gradle exports.
          # Ensure CI uses the Gradle path required by OpenXR and SDK overrides.
          sed -i 's/^gradle_build\/use_gradle_build=.*/gradle_build\/use_gradle_build=true/' "${CI_PROJECT_DIR}/export_presets.cfg"

          # NOTE: do NOT disable xr/openxr/enabled in project.godot here — that
          # setting is baked into the exported APK, and turning it off makes the
          # app launch as a flat 2D window on the headset (no OpenXR interface is
          # created at runtime, so use_xr is never enabled). The --xr-mode off
          # flag below already keeps OpenXR from initializing in the *export
          # tool* on the runtime-less CI runner, which is all we need to avoid a
          # crash during export — the main scene is not run while exporting.

          GODOT_COMMON_ARGS=(
            --verbose
            --audio-driver Dummy
            --xr-mode off
            --path "${CI_PROJECT_DIR}"
          )

          # Export Windows Desktop
          xvfb-run -a godot "${GODOT_COMMON_ARGS[@]}" \
            --export-debug "Windows Desktop" \
            "${CLIENT_DIR}/export/windows/Immersive2.exe"

          # Export Android (APK)
          xvfb-run -a godot "${GODOT_COMMON_ARGS[@]}" \
            --install-android-build-template \
            --export-debug "Android" \
            "${CLIENT_DIR}/export/android/Immersive2.apk"

          echo "Export outputs:"
          ls -lah "${CLIENT_DIR}/export/windows"
          ls -lah "${CLIENT_DIR}/export/android"

          test -f "${CLIENT_DIR}/export/windows/Immersive2.exe"
          test -f "${CLIENT_DIR}/export/android/Immersive2.apk"

      - name: Upload Client Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          name: immersive2_client_windows
          path: client/export/windows/*
          if-no-files-found: warn

      - name: Upload Client Android Artifact
        uses: actions/upload-artifact@v7
        with:
          name: immersive2_client_android
          path: client/export/android/*
          if-no-files-found: warn

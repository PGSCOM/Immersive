<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Immersive-2 WebXR View</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script>
    // An <img> fed by an MJPEG (multipart/x-mixed-replace) stream keeps
    // refreshing in the DOM, but the WebGL texture built from it is only
    // uploaded to the GPU once. Without flagging needsUpdate every frame the
    // VR panel would freeze on the first frame. This component re-uploads the
    // texture each tick so the stream stays live in the headset.
    AFRAME.registerComponent('live-texture', {
      tick: function () {
        var mesh = this.el.getObject3D('mesh');
        if (!mesh || !mesh.material || !mesh.material.map) {
          return;
        }
        var image = mesh.material.map.image;
        // Only refresh once the image actually has decoded pixels.
        if (image && (image.naturalWidth || image.width)) {
          mesh.material.map.needsUpdate = true;
        }
      }
    });
  </script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #02050a;
      font-family: "Space Grotesk", "Segoe UI", sans-serif;
    }

    .hud {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 12;
      color: #e1f2ff;
      background: rgba(5, 20, 35, 0.68);
      border: 1px solid rgba(111, 226, 255, 0.35);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
    }

    .hud strong {
      color: #8bffcf;
    }
  </style>
</head>
<body>
  <div class="hud">
    <strong>Immersive-2 WebXR</strong> - Use the browser Enter VR button.
    Stream source: /stream.mjpg (bridge must be connected).
  </div>

  <a-scene
    renderer="colorManagement: true; physicallyCorrectLights: false"
    embedded="false"
    vr-mode-ui="enabled: true"
    webxr="requiredFeatures: local-floor; optionalFeatures: bounded-floor,hand-tracking"
  >
    <a-assets>
      <img id="desktopStream" src="/stream.mjpg" crossorigin="anonymous" />
    </a-assets>

    <a-entity position="0 1.6 0">
      <a-camera wasd-controls-enabled="true"></a-camera>
    </a-entity>

    <a-entity light="type: ambient; color: #6aa9d2; intensity: 0.7"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 0.45" position="-1 2 1"></a-entity>

    <a-plane
      live-texture
      src="#desktopStream"
      width="2.4"
      height="1.35"
      position="0 1.6 -2.4"
      material="shader: flat"
    ></a-plane>

    <a-sky color="#050e18"></a-sky>
  </a-scene>
</body>
</html>
